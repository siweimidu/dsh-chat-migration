name: release

# Produces installable artifacts for any machine that has DSH >= 0.1.7:
#   GitHub Release assets  →  dsh plugin add <asset .tgz url>
#   raw branch URLs        →  dsh plugin add <raw .tgz url>   (no CI needed)
#
# npm publishing is intentionally not automated here: it needs a token with the
# `@xiaozhuang-dsh` scope, so run `pnpm publish -r --access public` locally when
# that credential exists (see docs/INSTALL-ANYWHERE.md).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:manifests
      - run: pnpm test

  pack:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack installable packages
        run: |
          mkdir -p dist
          pnpm --filter "@siweimidu/conversation-import" --filter "@siweimidu/chat-preset" exec pnpm pack --pack-destination "$PWD/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: dist/*.tgz

  release:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
